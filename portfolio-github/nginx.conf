server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Assets générés par Vite (nom avec hash) : cache long et immuable
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Tout le reste retombe sur index.html (page unique)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Compression
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml;
}
